# RTL8733BU USB combo: prevent btusb from auto-loading via udev at boot.
#
# The chip presents both WiFi (interface ff/ff/ff) and BT (interface e0/01/01)
# USB interfaces, so udev would load both 8733bu and btusb simultaneously.
# When btrtl downloads BT firmware on a freshly-powered chip it triggers a
# chip-level reset that disconnects the entire USB device — killing the WiFi
# driver (Runtime PM usage count underflow) and leaving the chip stuck until
# a GPIO power cycle.
#
# Blacklisting btusb prevents udev auto-load.  bluetooth.service's drop-in
# (written by 060-btusb_power quirk) explicitly loads btusb via modprobe
# when BT is actually needed — by that time 8733bu has fully initialized
# the combo firmware and the chip handles btrtl's reset correctly.
blacklist btusb

# When btusb IS explicitly loaded, ensure 8733bu goes first.
softdep btusb pre: 8733bu

# IPS disabled (rtw_ips_mode=0): the RTL8733BU is a USB combo WiFi+BT chip.
# IPS "card disable" powers down the shared firmware/MAC block when the WiFi
# interface is idle (e.g. after rfkill block wifi).  On this combo part that
# kills the Bluetooth interface too.  Disabling IPS keeps the combo firmware
# alive so BT works even when WiFi is soft-blocked via rfkill.  Full chip
# power-off is still handled by the rtl8733bu_power GPIO driver when both
# WLAN and BT rfkill are blocked.
options 8733bu rtw_ips_mode=0 rtw_power_mgnt=2 rtw_lps_level=1 rtw_lps_chk_by_tp=1 rtw_enusbss=0

name: Update mirror sources
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: update-mirror-sources
  cancel-in-progress: false

env:
  SOURCES_REPO: ${{ vars.SOURCES_REPO || 'rocknix-build-sources' }}

jobs:
  check-mirror:
    if: github.repository == 'UzuCore/ROCKNIXK'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - name: Check mirror access
        run: |
          test "$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/${SOURCES_REPO}" --jq '.permissions.push')" = true
          gh release view sources-v2 --repo "${GITHUB_REPOSITORY_OWNER}/${SOURCES_REPO}" >/dev/null

  get-sources:
    needs: check-mirror
    if: github.event_name != 'schedule' || github.ref_name == 'dev'
    name: Get sources (${{ matrix.device }})
    runs-on: ubuntu-24.04
    env:
      SKIP_GIT: true
    strategy:
      fail-fast: false
      matrix:
        device: [RK3326, RK3399, RK3566, RK3576, RK3588, H700, S922X, SM8250, SM8550, SM8650, SM8750, SM6115, SM4450, T618, SDM845]
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: get sources (${{ matrix.device }})
        uses: corrupt952/actions-retry-command@v1.0.7
        with:
          command: |
            PROJECT=ROCKNIX DEVICE=${{ matrix.device }} GET_HANDLER_SUPPORT="archive file" ./tools/download-tool > /tmp/download-${{ matrix.device }}.log 2>&1 || (tail -n 200 /tmp/download-${{ matrix.device }}.log; exit 1)
          max_attempts: 6
          retry_interval: 10
      - name: upload sources artifact (${{ matrix.device }})
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sources-${{ matrix.device }}
          path: sources/
          if-no-files-found: error
          retention-days: 3
      - name: upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: download-log-${{ matrix.device }}
          path: /tmp/download-${{ matrix.device }}.log
          if-no-files-found: ignore
          retention-days: 3

  push-sources:
    name: Push sources
    runs-on: ubuntu-24.04
    needs: get-sources
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download all sources artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sources-*
          merge-multiple: true
          path: collected-sources/
      - name: print number of downloaded artifacts
        run: find collected-sources/ -type f \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tgz" -o -name "*.tar.bz2" -o -name "*.deb" -o -name "*.tar.zst" \) | wc -l
      - name: Find missing artifacts
        id: find_missing
        run: |
          set -euo pipefail
          EXISTING_FILES=$(gh release view sources-v2 --repo "${GITHUB_REPOSITORY_OWNER}/${SOURCES_REPO}" --json assets --jq '.assets[].name')
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          groups = {}
          suffixes = (".tar.gz", ".tar.xz", ".tgz", ".tar.bz2", ".deb", ".tar.zst")
          for path in sorted(Path("collected-sources").rglob("*")):
              if path.is_file() and path.name.endswith(suffixes):
                  if path.stat().st_size == 0:
                      print(f"::warning::Skipping empty source file: {path}")
                      continue
                  groups.setdefault(path.name, []).append(path)

          with open("mirror-files.txt", "w") as output:
              for name, paths in sorted(groups.items()):
                  hashes = set()
                  for path in paths:
                      digest = hashlib.sha256()
                      with path.open("rb") as source:
                          for chunk in iter(lambda: source.read(1024 * 1024), b""):
                              digest.update(chunk)
                      hashes.add(digest.hexdigest())
                  if len(hashes) != 1:
                      print(f"::warning::Skipping conflicting source filename: {name}")
                      continue
                  output.write(str(paths[0]) + "\n")
          PY
          mapfile -t LOCAL_FILES < mirror-files.txt

          MISSING_FILES=()
          for file in "${LOCAL_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "::warning::Skipping empty source file: $file"
              continue
            fi
            BASENAME=$(basename "$file")
            if ! echo "$EXISTING_FILES" | grep -Fxq "$BASENAME"; then
              echo "Missing: $file"
              MISSING_FILES+=("$file")
            fi
          done

          if [ ${#MISSING_FILES[@]} -eq 0 ]; then
            echo "No missing files to upload."
            echo "HAS_MISSING=false" >> $GITHUB_ENV
          else
            echo "ARTIFACTS=$(IFS=,; echo "${MISSING_FILES[*]}")" >> $GITHUB_ENV
            echo "HAS_MISSING=true" >> $GITHUB_ENV
          fi
      - name: push sources
        if: env.HAS_MISSING == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: sources-v2
          artifacts: ${{ env.ARTIFACTS }}
          allowUpdates: true
          replacesArtifacts: false
          artifactErrorsFailBuild: false
          makeLatest: false
          prerelease: true
          token: ${{ secrets.GH_PAT }}
          repo: ${{ env.SOURCES_REPO }}

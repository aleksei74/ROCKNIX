name: '- 전체 기기 빌드'
run-name: "${{ inputs.build_type == 'b' && '- 추가 기기 빌드' || '- 전체 기기 빌드' }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      RK3326:
        description: 'RK3326'
        default: false
        type: boolean
      RK3399:
        description: 'RK3399'
        default: false
        type: boolean
      RK3566:
        description: 'RK3566'
        default: false
        type: boolean
      RK3576:
        description: 'RK3576'
        default: false
        type: boolean
      RK3588:
        description: 'RK3588'
        default: false
        type: boolean
      S922X:
        description: 'S922X'
        default: false
        type: boolean
      H700:
        description: 'H700'
        default: false
        type: boolean
      SM8250:
        description: 'SM8250'
        default: false
        type: boolean
      SM8550:
        description: 'SM8550'
        default: false
        type: boolean
      SM8650:
        description: 'SM8650'
        default: false
        type: boolean
      SM8750:
        description: 'SM8750'
        default: false
        type: boolean
      SM6115:
        description: 'SM6115'
        default: false
        type: boolean
      SM4450:
        description: 'SM4450'
        default: false
        type: boolean
      T618:
        description: 'T618 (needs build group b)'
        default: false
        type: boolean
      SDM845:
        description: 'SDM845 (needs build group b)'
        default: false
        type: boolean
      release:
        description: 'Official release (ROCKNIX repository only)'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      build_type:
        type: string
        required: false
        default: a
      device_inputs:
        type: string
        required: false
        default: ''
  pull_request:
    types: [ assigned ]

jobs:
  set-envs:
    if: (github.event_name != 'schedule') || (github.repository == 'UzuCore/ROCKNIXK' && github.ref_name == 'next')
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pr-approval' || 'auto' }}
    runs-on: ubuntu-24.04
    outputs:
      NIGHTLY: ${{ steps.set-release-type.outputs.NIGHTLY }}
      OFFICIAL: ${{ steps.set-release-type.outputs.OFFICIAL }}
      OWNER_LC: ${{ steps.set-envs.outputs.OWNER_OUTPUT }}
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Set lowercase owner name
        id: set-envs
        run: |
          OWNER_LC="${OWNER,,}"
          echo "OWNER_OUTPUT=${OWNER_LC}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}
      - name: Determine release type
        id: set-release-type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.release }}" == "true" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 0 1 * *" ]]; then
            echo "OFFICIAL=yes" >> $GITHUB_OUTPUT
            echo "NIGHTLY=no" >> $GITHUB_OUTPUT
          else
            echo "OFFICIAL=no" >> $GITHUB_OUTPUT
            echo "NIGHTLY=yes" >> $GITHUB_OUTPUT
          fi
      - id: generate
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'a' }}
          DEVICE_INPUTS: ${{ inputs.device_inputs || toJSON(inputs) }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_DEVICES: ${{ vars.SCHEDULE_DEVICES }}
        run: |
          python3 - <<'PY'
          import json
          import os

          devices = "RK3326 RK3399 RK3566 RK3576 RK3588 S922X H700 SM8250 SM8550 SM8650 SM8750 SM6115 SM4450 T618 SDM845".split()
          build_type = os.environ["BUILD_TYPE"].split(" - ", 1)[0]
          if os.environ["EVENT_NAME"] == "schedule":
              scheduled = os.environ.get("SCHEDULE_DEVICES", "")
              devices = [d.replace(" ", "") for d in scheduled.split(",") if d.replace(" ", "")] or devices
          elif build_type == "a":
              devices = [d for d in devices if d not in ("T618", "SDM845")]
          elif build_type == "b":
              devices = [d for d in devices if d in ("T618", "SDM845")]
          else:
              raise SystemExit(f"Unsupported build type: {build_type}")

          if os.environ["EVENT_NAME"] != "schedule":
              inputs = json.loads(os.environ.get("DEVICE_INPUTS", "{}"))
              selected = [d for d in devices if inputs.get(d) in (True, "true")]
              devices = selected or devices

          matrix = [{"device": d, "project": "ROCKNIX"} for d in devices]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          print(f"Build {build_type}: {', '.join(devices)}")
          PY

  build-docker:
    if: github.event_name != 'schedule' || (github.repository == 'UzuCore/ROCKNIXK' && github.ref_name == 'next')
    name: Docker
    needs: set-envs
    uses: ./.github/workflows/build-docker-image.yml
    with:
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}

  build-devices:
    if: (github.event_name != 'schedule') || (github.repository == 'UzuCore/ROCKNIXK' && github.ref_name == 'next')
    name: Build Devices
    needs:
      - set-envs
      - build-docker
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-envs.outputs.matrix) }}
    uses: ./.github/workflows/build-device.yml
    secrets: inherit
    with:
      PROJECT: ${{ matrix.project }}
      DEVICE: ${{ matrix.device }}
      OWNER_LC: ${{ needs.set-envs.outputs.OWNER_LC }}
      NIGHTLY: ${{ needs.set-envs.outputs.NIGHTLY }}
      OFFICIAL: ${{ needs.set-envs.outputs.OFFICIAL }}

  rerun-failed-jobs:
    if: always() && !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && fromJSON(github.run_attempt) < 3 && (github.ref_name == 'next' || github.ref_name == 'dev') && (github.event_name != 'schedule' || github.repository == 'UzuCore/ROCKNIXK')
    needs: build-devices
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry-workflow.yml -F run_id=${{ github.run_id }}

  release-nightly:
     if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.set-envs.outputs.NIGHTLY == 'yes' && github.event_name != 'pull_request' }}
     name: Release to My Repo
     needs:
       - set-envs
       - build-devices
     runs-on: ubuntu-24.04
     permissions:
       contents: write # 릴리즈 생성을 위해 쓰기 권한 필요
     steps:
     - name: debug needs
       run: echo '${{ toJSON(needs) }}'
     - name: Maximize build space
       uses: justinthelaw/maximize-github-runner-space@v0.9.0
       with:
         skip-components: docker-engine,gh-cli
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
         persist-credentials: false
     - name: Download artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: ROCKNIX-image*
         merge-multiple: true
     - name: Download artifacts
       uses: actions/download-artifact@v8
       with:
         pattern: ROCKNIX-update*
         merge-multiple: true
     #- name: get date
       #run: echo "DATE=$(TZ=Asia/Seoul date +'%Y%m%d')" >> $GITHUB_ENV

     - name: get date from file
       run: |
         FILENAME=$(ls ROCKNIX-* | head -n 1)
         FILE_TIME=$(echo $FILENAME | grep -oE '[0-9]{8,}' | head -n 1)
         echo "DATE=$FILE_TIME" >> $GITHUB_ENV

     - name: Set release metadata
       run: |
         if [[ "${GITHUB_REF_NAME}" == "t618" ]]; then
           echo "RELEASE_TAG=${DATE}-t618" >> $GITHUB_ENV
           echo "RELEASE_NAME=${DATE} T618" >> $GITHUB_ENV
           echo "RELEASE_PRERELEASE=true" >> $GITHUB_ENV
           echo "RELEASE_LATEST=false" >> $GITHUB_ENV
         elif [[ "${GITHUB_REF_NAME}" == "sdm845" ]]; then
           echo "RELEASE_TAG=${DATE}-sdm845" >> $GITHUB_ENV
           echo "RELEASE_NAME=${DATE} SDM845" >> $GITHUB_ENV
           echo "RELEASE_PRERELEASE=true" >> $GITHUB_ENV
           echo "RELEASE_LATEST=false" >> $GITHUB_ENV
         else
           echo "RELEASE_TAG=${DATE}" >> $GITHUB_ENV
           echo "RELEASE_NAME=${DATE}" >> $GITHUB_ENV
           echo "RELEASE_PRERELEASE=false" >> $GITHUB_ENV
           echo "RELEASE_LATEST=true" >> $GITHUB_ENV
         fi

     - name: Generate changelog
       shell: bash
       run: |
         git fetch --tags

         CURRENT_TAG="${RELEASE_TAG}"
         PREV_TAG=$(git tag --sort=-creatordate | grep -vx "${CURRENT_TAG}" | head -n 1 || true)

         if [ -z "$PREV_TAG" ]; then
           COMMITS=$(git log --pretty=format:"%h %s (%an)" | grep -v "Merge branch" || true)
         else
           COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%h %s (%an)" | grep -v "Merge branch" || true)
         fi

         {
           echo "## 변경사항"
           if [ -z "$COMMITS" ]; then
             echo "- 변경된 커밋 없음"
           else
             echo "$COMMITS"
           fi
           echo ""
         } > release_notes.md

     - name: Create Release
       uses: ncipollo/release-action@v1
       with:
         tag: ${{ env.RELEASE_TAG }}
         name: ${{ env.RELEASE_NAME }}
         artifacts: "ROCKNIX-*"          # 업로드할 파일 패턴
         allowUpdates: true              # 같은 날짜에 다시 돌리면 덮어쓰기 허용
         makeLatest: ${{ env.RELEASE_LATEST }}
         prerelease: ${{ env.RELEASE_PRERELEASE }}
         #body: "빌드완료"
         bodyFile: release_notes.md
         token: ${{ secrets.GH_PAT }}    # 토큰 사용

  release-official:
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.repository_owner == 'ROCKNIX' && needs.set-envs.outputs.OFFICIAL == 'yes' }}
    name: Release official
    needs:
      - set-envs
      - build-devices
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: justinthelaw/maximize-github-runner-space@v0.9.0
        with:
          skip-components: docker-engine,gh-cli
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ROCKNIX-image*
          merge-multiple: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ROCKNIX-update*
          merge-multiple: true
      - name: get date
        run: echo "DATE=$(date +'%Y%m%d')" >> $GITHUB_ENV
      - name: get last tag
        id: get-last-tag
        run: |
          echo "TAG=$(git tag --sort=-creatordate | head -n 1)" >> $GITHUB_OUTPUT
      - name: Generate installation token for GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NIGHTLY_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Install xmlstarlet
        run: sudo apt-get install -y xmlstarlet
      - name: Generate release body
        env:
          CHANGELOG_MAX_COUNT: 200
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash .github/scripts/generate-release-body.sh "${{ env.DATE }}" "${{ steps.get-last-tag.outputs.TAG }}" > release-body.md
      - name: release official
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ env.DATE }}" ROCKNIX-* \
            --target "${{ github.sha }}" \
            --title "${{ env.DATE }}" \
            --notes-file release-body.md \
            --latest
